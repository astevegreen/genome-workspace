name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # event gets its own group per commit: GitHub also drops a *pending* run when a newer one joins
  # its group, so a shared main group would leave the middle of three quick pushes unverified.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Runs take under a minute; the limit stops a hung run early instead of after six hours.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Run unit tests
        run: uv run --frozen --python 3.12 python -m pytest tests/ -v
